name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  R_LIBS_USER: ${{ github.workspace }}/.R/library
  HARMORUST_REQUIRE_PARITY: "1"

jobs:
  test:
    name: reference-blas (source harmony, ncores=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install reference BLAS/LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libblas-dev liblapack-dev gfortran
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false
      - name: Install CRAN harmony from source
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          install.packages(
            c("Rcpp", "RcppArmadillo", "RcppProgress", "RhpcBLASctl", "harmony"),
            type = "source",
            Ncpus = 2
          )
          stopifnot(require("harmony", quietly = TRUE))
          cat("harmony", as.character(packageVersion("harmony")), "\n")
          cat("BLAS", as.character(extSoftVersion()["BLAS"]), "\n")
          cat("LAPACK", as.character(La_library()), "\n")
      - name: Test harmorust
        run: cargo test --workspace
        env:
          RAYON_NUM_THREADS: "1"
      - name: Bench smoke
        run: cargo run -p harmorust --release -- bench --cells 800
      - name: Compare harness smoke
        run: cargo run -p harmorust --release -- compare --cells 80 --repeats 1 --warmup 0 --rust-only
      - name: Parity command is wired
        run: cargo run -p harmorust --release -- help 2>&1 | grep -q parity
      - name: Parity gate vs source-built harmony
        run: cargo run -p harmorust --release -- parity --check --cells 200,500 --nclust 1,5 --ncores 1

  test-openblas:
    name: openblas (binary harmony, ncores=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install CRAN harmony
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          install.packages(c("harmony", "RhpcBLASctl"), Ncpus = 2)
          stopifnot(require("harmony", quietly = TRUE))
          cat(as.character(packageVersion("harmony")), "\n")
      - name: Test harmorust
        run: cargo test --workspace
        env:
          RAYON_NUM_THREADS: "1"
      - name: Parity gate vs OpenBLAS harmony
        run: cargo run -p harmorust --release -- parity --check --cells 200,500 --nclust 1,5 --ncores 1
        env:
          # Kernel GEMM order is not reproducible; measured ridge floor is ~3e-5.
          HARMORUST_PARITY_MAX: "1e-4"
