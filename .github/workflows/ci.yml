name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test harmorust
        run: cargo test --workspace
      - name: Bench smoke
        run: cargo run -p harmorust --release -- bench --cells 800
