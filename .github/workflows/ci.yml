name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  R_LIBS_USER: ${{ github.workspace }}/.R/library
  HARMORUST_REQUIRE_PARITY: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install R and CRAN harmony
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base r-base-dev libopenblas-dev
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages(c("harmony", "RhpcBLASctl"), repos = "https://cloud.r-project.org")'
          Rscript -e 'stopifnot(require("harmony", quietly = TRUE)); cat(as.character(packageVersion("harmony")), "\n")'
      - name: Test harmorust
        run: cargo test --workspace
      - name: Bench smoke
        run: cargo run -p harmorust --release -- bench --cells 800
      - name: Compare harness smoke
        run: cargo run -p harmorust --release -- compare --cells 80 --repeats 1 --warmup 0 --rust-only
      - name: Parity command is wired
        run: cargo run -p harmorust --release -- help 2>&1 | grep -q parity
      - name: Parity gate vs CRAN harmony
        run: cargo run -p harmorust --release -- parity --check --cells 200,500 --nclust 1,5
