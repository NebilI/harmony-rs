name: Publish harmorust R package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish. Leave empty to use v from r/harmorust/DESCRIPTION.
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the tarball to and point r-universe at
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-r:
    name: Build tarball and sync r-universe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: "https://NebilI.r-universe.dev"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Add Cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install R build dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/harmorust
          dependencies: '"hard"'

      - name: Stage Rust crate into the R package
        run: sh r/harmorust/tools/prepare-rust.sh

      - name: Build source tarball
        run: R CMD build r/harmorust

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "${RELEASE_TAG_NAME}" ]; then
            tag="${RELEASE_TAG_NAME}"
          else
            version=$(awk '/^Version:[[:space:]]*/ { print $2; exit }' r/harmorust/DESCRIPTION)
            if [ -z "${version}" ]; then
              echo "Could not read Version from r/harmorust/DESCRIPTION" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: harmorust_*.tar.gz

      - name: Sync r-universe registry
        env:
          R_UNIVERSE_REGISTRY_TOKEN: ${{ secrets.R_UNIVERSE_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "${R_UNIVERSE_REGISTRY_TOKEN}" ]; then
            echo "::warning::R_UNIVERSE_REGISTRY_TOKEN not configured; skipping r-universe sync"
            exit 0
          fi
          ./scripts/sync-r-universe.sh "${RELEASE_TAG}"
