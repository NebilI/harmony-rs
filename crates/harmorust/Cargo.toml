[package]
name = "harmorust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust port of the Harmony single-cell integration algorithm (Korsunsky et al. 2019 / Harmony2)"
readme = "README.md"
keywords = ["bioinformatics", "single-cell", "harmony", "batch-correction"]
categories = ["science"]

[lib]
name = "harmorust"
path = "src/lib.rs"

[[bin]]
name = "harmorust"
path = "src/main.rs"

[dependencies]
ndarray = "0.16"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
